    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-73ZWZ7GJN1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-73ZWZ7GJN1');
    </script>
    
    <title>ATMOS — Experiências na Chapada dos Veadeiros</title>
    <meta name="description" content="Roteiros personalizados, cachoeiras, experiências e hospedagens na Chapada dos Veadeiros. Planeje sua viagem com a ATMOS." />
    <meta name="author" content="ATMOS Turismo" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(255,0,0,0.9);color:white;z-index:9999;padding:2rem;font-family:monospace;overflow:auto;">' +
          '<h1>Erro de Execução (Runtime Error)</h1>' +
          '<p><strong>Message:</strong> ' + message + '</p>' +
          '<p><strong>Source:</strong> ' + source + ':' + lineno + ':' + colno + '</p>' +
          '<pre style="background:#000;padding:1rem;margin-top:1rem;">' + (error && error.stack ? error.stack : 'No stack trace') + '</pre>' +
          '</div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(255,0,0,0.9);color:white;z-index:9999;padding:2rem;font-family:monospace;overflow:auto;">' +
          '<h1>Unhandled Promise Rejection</h1>' +
          '<p><strong>Reason:</strong> ' + event.reason + '</p>' +
          '<pre style="background:#000;padding:1rem;margin-top:1rem;">' + (event.reason && event.reason.stack ? event.reason.stack : 'No stack trace') + '</pre>' +
          '</div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
